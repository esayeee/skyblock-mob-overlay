name: Build

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 26.1 要求 JDK 25 作为 Gradle 运行时
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      # 用官方 gradle/actions/setup-gradle 直接拉取指定版本的 Gradle 来跑，
      # 这样不依赖仓库里是否提交了 gradle-wrapper.jar 这个二进制文件
      # （建议你本地跑一次 `gradle wrapper --gradle-version 9.4` 后把
      #  生成的 gradlew / gradlew.bat / gradle/wrapper/* 一起提交，
      #  之后这个 workflow 可以直接改回 `./gradlew build`）。
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.0'
          cache-read-only: false

      - name: Build with Gradle
        run: gradle build --stacktrace

      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: skyblock-overlay-jar
          path: build/libs/*.jar
          if-no-files-found: error

      # 打 tag（例如 v1.0.0）推送时，额外把 jar 作为 GitHub Release 附件发布
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
