plugins {
	id 'fabric-loom' version '1.15-SNAPSHOT'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// YetAnotherConfigLib
	maven { url 'https://maven.isxander.dev/releases' }
	maven { url 'https://maven.terraformersmc.com/releases/' } // Mod Menu
}

// 26.1 起 Mojang 官方映射已完全去混淆，直接用 officialMojangMappings()
// 不再需要 Yarn intermediary。
loom {
	// 26.1 起客户端/服务端源集分离，避免把纯客户端渲染代码打进 dedicated server
	splitEnvironmentSourceSets()

	mods {
		"skyblockoverlay" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// YetAnotherConfigLib + 其依赖的 3rd-party-cursed-lib
	modImplementation "dev.isxander:yetanotherconfiglib:${project.yacl_version}"
	modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = targetJavaVersion
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.toVersion(targetJavaVersion)
	targetCompatibility = JavaVersion.toVersion(targetJavaVersion)
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.archivesBaseName}" }
	}
}
