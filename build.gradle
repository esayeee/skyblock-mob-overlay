plugins {
	// 26.1 起插件 id 从旧的 'fabric-loom' 换成不做重映射的新插件
	id 'net.fabricmc.fabric-loom' version '1.15-SNAPSHOT'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// YetAnotherConfigLib
	maven { url 'https://maven.isxander.dev/releases' }
	maven { url 'https://maven.terraformersmc.com/releases/' } // Mod Menu
}

// 26.1 起客户端完全反混淆，Mojang / Fabric 都不再提供任何 mappings 文件，
// 所以下面 dependencies 里【不能】再写 `mappings loom.officialMojangMappings()`
// 这一行——它对应的 mappings 产物在 26.1 已经不存在了，写了就是本项目
// 之前遇到的 "Failed to find official mojang mappings for 26.1.2" 报错的根源。
loom {
	// 26.1 起客户端/服务端源集分离，避免把纯客户端渲染代码打进 dedicated server
	splitEnvironmentSourceSets()

	mods {
		"skyblockoverlay" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// 无 mappings 行 —— 26.1 客户端本身就是可读的官方命名，
	// Loom 直接把它当成一个普通带源码的 Java 库来用。

	// 26.1 起不再需要 modImplementation/modCompileOnly 这种"帮你重映射"
	// 的特殊配置，普通的 implementation/compileOnly 就够了。
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	//
